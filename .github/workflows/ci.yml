name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Third-party dependency allowlist. Cheap, and failing here is cheap --
      # the same check gates the release, so a PR that adds an unapproved or
      # abandoned dependency finds out now rather than at tag time.
      # The allowlist is FETCHED, never vendored: one source, no copies to drift.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          # Delete it. A fetched checkout left lying in the workspace is not
          # inert: vitest globbed the checker's own tests out of it and failed
          # a package whose code was fine. Removed with node, not rm -rf,
          # because some of these matrices run on windows-latest where a
          # multi-line run: block is PowerShell and rm -rf is not a command.
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Standalone CI has no pnpm workspace, so rewrite any `workspace:*` deps to
      # a plain range before install. A no-op when there are none.
      - name: Rewrite workspace protocol
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));for(const s of ['dependencies','devDependencies','peerDependencies','optionalDependencies']){if(!p[s])continue;for(const[n,v]of Object.entries(p[s])){if(typeof v==='string'&&v.startsWith('workspace:'))p[s][n]=v.slice('workspace:'.length)||'*';}}fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"

      # The Live Contract parity test compares this package's contract against the
      # PHP twin's. Without the repo here it found no file and every assertion
      # returned early -- green, having compared nothing.
      - name: Check out fancy-flow-php
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/fancy-flow-php
          path: .php-flow

      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Lint
        run: npm run lint --if-present

      # BUILD BEFORE TEST, deliberately.
      #
      # Some guards can only assert against the ARTIFACT. `engine-is-react-free`
      # is the clearest: `rich-input.tsx` has only a TYPE import from react, so a
      # source grep calls `/engine` clean while the JSX transform injects
      # `react/jsx-runtime` at build time. The only honest check walks the built
      # graph.
      #
      # With Test first, that guard could never pass here — it failed with "run
      # `npm run build` first" on every run from the moment it was added, and
      # went unread through two releases. A gate nobody stands at is worse than
      # no gate: it is a red tick people learn to scroll past.
      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present
        env:
          FLOW_PHP_SRC: ${{ github.workspace }}/.php-flow/src/Laravel
